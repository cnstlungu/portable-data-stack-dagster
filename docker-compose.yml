services:
  # generator, dbt and superset are built straight from the
  # postcard-company-datamart repo, by git URL, at the tag in DATAMART_REF.
  # To build from another branch or tag: DATAMART_REF=main docker compose build
  generator:
    build:
      context: https://github.com/cnstlungu/postcard-company-datamart.git#${DATAMART_REF:-v1.3.0}:generator
    volumes:
      - ./shared:/shared
    environment:
      INPUT_FILES_PATH: /shared/parquet
      N_TRANSACTIONS: ${N_TRANSACTIONS:-100000}
  # Copies the dbt project into ./dbt/postcard_company, which Dagster runs
  # it from. It copies only when DATAMART_REF brings a different version of the
  # project, so edits you make there survive restarts.
  dbt:
    build:
      context: https://github.com/cnstlungu/postcard-company-datamart.git#${DATAMART_REF:-v1.3.0}:postcard_company
    volumes:
      - ./dbt/postcard_company:/datamart/postcard_company
  dagster:
    build:
      context: .
      dockerfile: ./dagster/Dockerfile
    restart: always
    environment:
        DUCKDB_FILE_PATH: /shared/db/datamart.duckdb
        INPUT_FILES_PATH: /shared/parquet
    volumes:
        - ./shared:/shared
        - ./dbt/postcard_company:/postcard_company
    ports:
        - "3000:3000"
    depends_on:
      generator:
        condition: service_completed_successfully
      dbt:
        condition: service_completed_successfully
  # Superset runs as uid 1000 and opens the DuckDB warehouse read-write, but the
  # bind-mounted file belongs to whoever created it on the host. Relax the mode
  # here so the stack works regardless of the host user's uid.
  init-db-permissions:
    image: busybox:1.37.0
    command: sh -c "chmod -R a+rwX /shared/db"
    volumes:
      - ./shared:/shared

  superset:
    build:
      context: https://github.com/cnstlungu/postcard-company-datamart.git#${DATAMART_REF:-v1.3.0}:superset
    environment:
      # Read by the datamart's superset/entrypoint.sh at container start. These were
      # build args until it turned out `docker history` shows them.
      SUPERSET_ADMIN: ${SUPERSET_ADMIN}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
        - "8088:8088"
    command:     gunicorn --bind  "0.0.0.0:8088" --access-logfile '-' --error-logfile '-' --workers 1 --worker-class gthread --threads 20 --timeout 60 --limit-request-line 0 --limit-request-field_size 0 "superset.app:create_app()"
    volumes:
      - ./shared/db:/app/superset_home/db
    depends_on:
      dagster:
        condition: service_started
      init-db-permissions:
        condition: service_completed_successfully
